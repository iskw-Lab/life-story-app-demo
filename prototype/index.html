<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOMONI ケース会議支援（試作）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#app" id="skipLink">本文へ移動</a>
<header class="topbar" id="topbar">
  <a class="brand" href="#/">TOMONI <span>ケース会議支援（試作）</span></a>
  <nav class="crumbs" id="crumbs" aria-label="現在地"></nav>
  <label class="role">操作者の立場（試作）
    <select id="roleSelect">
      <option value="支援者">支援者</option>
      <option value="本人">本人</option>
      <option value="家族">家族</option>
      <option value="ピア">ピアサポーター</option>
      <option value="進行役">進行役</option>
    </select>
  </label>
</header>
<div class="banner" id="banner">シーズデータ（架空の生育史）による試作です。会議データはすべて模擬入力、レイヤ・関係・候補は自動生成の候補で、確定した事実ではありません。この画面で付けた印や記録は、このブラウザ内にだけ保存されます。</div>
<main id="app" tabindex="-1"></main>
<aside id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <nav class="drawer-crumbs" id="drawerCrumbs" aria-label="たどった経路"></nav>
    <button class="icon-btn" id="drawerClose" aria-label="詳細パネルを閉じる">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div id="tooltip" role="tooltip" hidden></div>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<script src="data/seed.js"></script>
<script src="app.js"></script>
<script src="views.js"></script>
</body>
</html>
